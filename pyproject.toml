[project]
name = "dqa"
version = "0.1.0"
description = "Enterprise Item Data-Quality Assistant"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.20.1",
  "celery>=5.6.3",
  "fastapi>=0.162.0",
  "httpx>=0.28.1",
  "psycopg[binary]>=3.3.8",
  "pydantic>=2.7",
  "python-multipart>=0.0.33",
  "rapidfuzz>=3.9",
  "sqlalchemy>=2.1.8",
  "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
  "pytest>=8.2",
  "pytest-cov>=5.0",
  "hypothesis>=6.100",
  "ruff>=0.5",
  "mypy>=1.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["dqa"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
strict = true
python_version = "3.12"
plugins = ["pydantic.mypy"]

[tool.coverage.report]
fail_under = 85

[[tool.mypy.overrides]]
module = ["celery.*", "kombu.*"]
ignore_missing_imports = true
follow_untyped_imports = true

[[tool.mypy.overrides]]
module = "dqa.workers.*"
disallow_untyped_decorators = false  # celery has no stubs
disallow_untyped_calls = false
disallow_any_unimported = false
warn_return_any = false
